name: Import from the old site

# Started from the website's admin page (Import tab), or from the Actions tab on GitHub.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to import: poems, covers or all"
        required: true
        default: "poems"

permissions:
  contents: write

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Import
        env:
          WHAT: ${{ github.event.inputs.what }}
        run: node scripts/import-google-sites.mjs --what="$WHAT"
      - name: Save the imported content
        run: |
          git config user.name "Site import"
          git config user.email "actions@users.noreply.github.com"
          git add content assets
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Import from the old site"
            git push
          fi
